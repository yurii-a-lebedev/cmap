<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMAP — хосты</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="{{ url_for('static', filename='cmap-logo.svg') }}" alt="" width="28" height="28">
        CMAP <span>container map</span>
      </div>
      <nav class="nav">
        <a href="/">Контейнеры</a>
        <a href="/map">Карта</a>
        <a class="active" href="/manage_hosts">Хосты</a>
      </nav>
    </header>

    <main class="page">
      <div class="page-head">
        <div>
          <h1>Хосты Docker</h1>
          <p>localhost ходит через docker.sock. Удалённые — по Docker API (порт).</p>
        </div>
      </div>

      <ul class="host-list" id="host-list"></ul>
      <div class="toast" id="list-toast"></div>

      <h2 style="margin:28px 0 12px;font-size:1.1rem">Добавить хост</h2>
      <form class="form-card" id="host-form">
        <label>Хост
          <input class="input" id="host" required placeholder="например 192.168.1.10">
        </label>
        <label>Порт API
          <input class="input" id="port" type="number" value="2375" required>
        </label>
        <button class="btn btn-primary" type="submit">Добавить хост</button>
        <div class="toast" id="form-toast"></div>
      </form>
    </main>
  </div>

  <script>
    const formToast = document.getElementById('form-toast');
    const listToast = document.getElementById('list-toast');

    async function fetchHosts() {
      listToast.textContent = '';
      const response = await fetch('/hosts');
      let hosts = await response.json();
      hosts = hosts.sort((a, b) => (a.host === 'localhost' ? -1 : b.host === 'localhost' ? 1 : 0));
      const hostList = document.getElementById('host-list');
      hostList.innerHTML = '';
      hosts.forEach(host => {
        const li = document.createElement('li');
        li.className = 'host-item';
        const meta = document.createElement('div');
        meta.className = 'host-meta';
        const title = document.createElement('strong');
        title.textContent = host.visible_name || host.host;
        const sub = document.createElement('span');
        sub.textContent = host.host === 'localhost'
          ? 'localhost · docker.sock'
          : `${host.host}:${host.port}`;
        meta.append(title, sub);

        const actions = document.createElement('div');
        actions.className = 'host-actions';

        const nameInput = document.createElement('input');
        nameInput.className = 'input';
        nameInput.placeholder = 'Отображаемое имя';
        nameInput.value = host.visible_name || '';

        const saveBtn = document.createElement('button');
        saveBtn.className = 'btn';
        saveBtn.type = 'button';
        saveBtn.textContent = 'Сохранить имя';
        saveBtn.onclick = () => updateHostName(host.id, nameInput.value);

        actions.append(nameInput, saveBtn);

        if (host.host !== 'localhost') {
          const delBtn = document.createElement('button');
          delBtn.className = 'btn btn-danger';
          delBtn.type = 'button';
          delBtn.textContent = 'Удалить';
          delBtn.onclick = () => deleteHost(host.id);
          actions.append(delBtn);
        } else {
          const lock = document.createElement('span');
          lock.className = 'badge';
          lock.textContent = 'защищён';
          actions.append(lock);
        }

        li.append(meta, actions);
        hostList.appendChild(li);
      });
    }

    async function addHost(event) {
      event.preventDefault();
      formToast.textContent = '';
      const host = document.getElementById('host').value.trim();
      const port = Number(document.getElementById('port').value);
      if (!host) {
        formToast.textContent = 'Укажите хост';
        return;
      }
      const response = await fetch('/hosts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ host, port }),
      });
      if (!response.ok) {
        formToast.textContent = 'Не удалось добавить хост';
        return;
      }
      document.getElementById('host-form').reset();
      document.getElementById('port').value = 2375;
      fetchHosts();
    }

    async function updateHostName(id, name) {
      listToast.textContent = '';
      const response = await fetch('/hosts', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, visible_name: name }),
      });
      if (!response.ok) {
        listToast.textContent = 'Не удалось сохранить имя';
        return;
      }
      fetchHosts();
    }

    async function deleteHost(id) {
      listToast.textContent = '';
      const response = await fetch('/hosts', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id }),
      });
      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        listToast.textContent = data.message || 'Не удалось удалить';
        return;
      }
      fetchHosts();
    }

    document.getElementById('host-form').addEventListener('submit', addHost);
    document.addEventListener('DOMContentLoaded', fetchHosts);
  </script>
</body>
</html>
