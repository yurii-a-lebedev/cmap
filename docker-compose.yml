services:
  cmap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cmap
    volumes:
      - ./instance:/app/instance
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - FLASK_ENV=production
      - PYTHONDONTWRITEBYTECODE=1
      - SQLALCHEMY_DATABASE_URI=sqlite:////app/instance/hosts.db
    command: gunicorn -w 2 -b 0.0.0.0:5000 app.main:app
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.cmap_https.redirectscheme.scheme=https
      - traefik.http.routers.cmap.entrypoints=web
      - traefik.http.routers.cmap.middlewares=internal-allowlist@file,cmap_https@docker
      - traefik.http.routers.cmap.rule=Host(`cmap.main.tx0.ru`)
      - traefik.http.routers.cmap_https.entrypoints=websecure
      - traefik.http.routers.cmap_https.middlewares=internal-allowlist@file
      - traefik.http.routers.cmap_https.rule=Host(`cmap.main.tx0.ru`)
      - traefik.http.routers.cmap_https.tls=true
      - traefik.http.routers.cmap_https.tls.certresolver=le
      - traefik.http.services.cmap.loadbalancer.server.port=5000
      - connect_to=traefik:443
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

networks:
  default:
    external: true
    name: traefik_network
