stages:
  - sync
  - deploy

variables:
  APP_DIR: /data/service/cmap
  FLASK_ENV: development
  SQLALCHEMY_DATABASE_URI: sqlite:///hosts.db

sync:
  stage: sync
  script:
    - echo "Cleaning up files in target directory..."
    - sudo find $APP_DIR -type f -name "*" -exec rm -f {} +
    - echo "Synchronizing application files..."
    - rsync -avz --delete ./ $APP_DIR/
    - echo "Application files synchronized."
  tags:
    - jump

deploy:
  stage: deploy
  script:
    - echo "Deploying the application..."
    - cd $APP_DIR
    - sh start.sh
  tags:
    - jump
