stages:
  - sync
  - deploy

variables:
  APP_DIR: /data/config/cmap
  FLASK_ENV: development
  SQLALCHEMY_DATABASE_URI: sqlite:///hosts.db

sync:
  stage: sync
  script:
    - echo "Cleaning up files in target directory..."
    - sudo find $APP_DIR -mindepth 1 -exec rm -rf {} +
    - echo "Synchronizing application files..."
    - rsync -avz --delete ./ $APP_DIR/
    - echo "Application files synchronized."
  tags:
    - main

deploy:
  stage: deploy
  script:
    - echo "Deploying the application..."
    - cd $APP_DIR
    - docker-compose down -v
    - rm -rf app/__pycache__
    - docker-compose build --no-cache
    - docker-compose up -d
    - sleep 3
    - docker logs cmap

  tags:
    - main
