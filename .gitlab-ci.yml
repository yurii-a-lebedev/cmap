stages:
  - sync
  - deploy

variables:
  APP_DIR: /data/config/cmap
  FLASK_ENV: development
  SQLALCHEMY_DATABASE_URI: sqlite:///hosts.db
  GIT_DEPTH: 0

sync:
  stage: sync
  script:
    - mkdir -p $APP_DIR
    - rsync -avz --delete --exclude '.git/' --exclude '.env' --exclude 'instance/' ./ $APP_DIR/
  tags:
    - main

deploy:
  stage: deploy
  script:
    - cd $APP_DIR
    - docker compose down --remove-orphans
    - rm -rf app/__pycache__
    - docker compose up -d --build
    - sleep 3
    - docker logs cmap
  tags:
    - main
