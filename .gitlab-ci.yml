stages:
  - sync
  - deploy

variables:
  APP_DIR: /data/config/cmap
  GIT_DEPTH: 0

sync:
  stage: sync
  script:
    - mkdir -p "$APP_DIR"
    - rsync -avz --delete --exclude '.git/' --exclude '.env' --exclude 'instance/' --exclude '__pycache__/' --exclude '*.pyc' ./ "$APP_DIR/"
  tags:
    - main

deploy:
  stage: deploy
  script:
    - cd "$APP_DIR"
    - docker compose down --remove-orphans
    - docker compose up -d --build
    - sleep 5
    - docker logs cmap --tail 40
    - |
      code=$(curl -sk -o /dev/null -w "%{http_code}" --resolve cmap.main.tx0.ru:443:127.0.0.1 https://cmap.main.tx0.ru/)
      echo "health HTTP $code"
      test "$code" = "200"
  tags:
    - main
